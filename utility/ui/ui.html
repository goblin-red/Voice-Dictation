<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOBL(in) Voice</title>
<link rel="stylesheet" href="/goblin-ui.css">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: var(--fs-body)/1.45 var(--font);
  }


  main { max-width: var(--w-settings); margin: 0 auto; padding: var(--s5) var(--s4) 72px; }
  h1 { font-size: var(--fs-screen); margin: 0 0 2px; }
  :focus-visible { outline: none; box-shadow: var(--focus); }
  .muted { color: var(--muted); }
  .home-tools #pauseBtn { color: #fff; background: #b9343f; border-color: #b9343f; }
  .home-tools #pauseBtn[data-act="voice.resume"] { background: #23774d; border-color: #23774d; }
  .home-tools .g-btn[data-act="hush"] { color: #fff; background: #a45109; border-color: #a45109; }
  .home-tools #pauseBtn:hover, .home-tools .g-btn[data-act="hush"]:hover { filter: brightness(1.12); }


  .act { border-top: 1px solid var(--line); padding: 12px 0 4px; }
  .act h3 { font-size: var(--fs-body); margin: 0 0 4px; }
  .act .ask { color: var(--muted); margin: 0 0 6px; }
  .act ol { margin: 0 0 6px; padding-left: 20px; }
  .act .note { color: var(--muted); font-size: var(--fs-label); }
  .g-section .hint { color: var(--muted); font-size: var(--fs-hint); margin: 0 0 12px; }
  .sub-h { margin: var(--s5) 0 var(--s2); font-size: var(--fs-label); font-weight: 700; color: var(--muted);
           text-transform: uppercase; letter-spacing: .04em; }

  .row.mode-off { opacity: .4; }
  .sources { margin-top: 8px; display: grid; gap: 6px; }
  .source { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; column-gap: 8px; align-items: center; font-size: var(--fs-hint); padding: 4px 0; }
  .source > .g-switch { grid-row: span 2; }
  .source i { width: 9px; height: 9px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
  .source.on i { background: var(--ok); box-shadow: none; }
  .source.found i { background: var(--warn); box-shadow: none; }
  .source .src-detail { grid-column: 2; color: var(--muted); font-size: var(--fs-label); }
  .src-log { grid-column: 2 / 4; margin-top: 4px; font-size: var(--fs-label); }
  .src-log summary { cursor: pointer; color: var(--muted); }
  .src-items { display: grid; gap: 6px; margin: 6px 0 4px; max-height: 360px; overflow: auto; }
  .src-item { padding: 6px 8px; border-radius: var(--r-sm); background: var(--surface-2); white-space: pre-wrap; }
  .src-item time { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .custom-add { display: flex; gap: 8px; margin: 8px 0; }
  .custom-add input { flex: 1; min-width: 0; }
  .custom-del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; min-width: var(--hit); min-height: var(--hit); }
  .src-actions { display: flex; align-items: center; gap: 12px; grid-row: span 2; }
  textarea { resize: vertical; box-sizing: border-box; line-height: 1.4; }
  .hint-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; font-size: var(--fs-label); }
  .hint-list > span { background: var(--surface-2); border-radius: var(--r-sm); padding: 2px 6px; display: inline-flex; align-items: center; gap: 5px; }
  .hint-list button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 0 3px; font: inherit; }
  #livePromptReset { margin-top: 6px; }
  .hint-count { margin-top: 6px; font-size: var(--fs-label); color: var(--muted); }
  .hint-count b { color: var(--text); }
  .hint-count.full b { color: var(--err); }
  .custom-curl { font-size: 11px; white-space: pre-wrap; word-break: break-all; color: var(--muted); background: var(--surface-2); padding: 8px; border-radius: var(--r-sm); }
  .source.disabled-src { opacity: .6; }

  .row > .g-switch, .seg-block > .g-switch { align-self: center; }
  .row label small, .seg-block label small { font-size: var(--fs-label); }
  [data-group="sound.mic_mode"] { flex-wrap: wrap; max-width: 100%; }
  #inputFocusSelect { min-width: 0; max-width: 100%; }
  .input-focus-name-controls { display: flex; flex: 1 1 300px; flex-wrap: wrap; align-items: center; gap: var(--s2); min-width: 0; }
  #inputFocusName { flex: 1 1 125px; min-width: 0; }


  details.cmd-item { border-top: 1px solid var(--line); }
  details.cmd-item:first-child { border-top: 0; }
  details.cmd-item > summary {
    list-style: none; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
    min-height: var(--hit); padding: 9px 0; cursor: pointer; user-select: none;
  }
  details.cmd-item > summary::-webkit-details-marker { display: none; }
  details.cmd-item > summary::before {
    content: ""; width: 6px; height: 6px; flex: none; align-self: center;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg); transition: transform .15s;
  }
  details.cmd-item[open] > summary::before { transform: rotate(45deg); }
  details.cmd-item > summary:hover b { color: var(--accent); }
  .cmd-item .cmd-word { font-weight: 600; white-space: nowrap; }
  .cmd-item .cmd-short { color: var(--muted); font-size: var(--fs-hint); flex: 1 1 180px; min-width: 0; }
  .cmd-item .cmd-state { display: none; color: var(--err); font-size: var(--fs-label); white-space: nowrap; }
  .cmd-item.off .cmd-state { display: inline; }
  .cmd-item.off > summary b { text-decoration: line-through; }
  .cmd-item .cmd-fuzzy { display: none; color: var(--accent); font-size: var(--fs-label); white-space: nowrap; border: 1px solid currentColor; border-radius: var(--r-full); padding: 0 7px; }
  .cmd-item.fuzzy:not(.off) .cmd-fuzzy { display: inline; }
  .cmd-body { padding: 0 0 12px 16px; }
  .cmd-body p { margin: 0 0 6px; }
  .cmd-body .cmd-ex {
    background: var(--accent-soft); color: var(--text);
    border-radius: var(--r-sm); padding: 1px 6px; font-weight: 600;
  }
  .cmd-body .hint { margin: 0; }
  .cmd-head { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .cmd.off .chips { opacity: .45; }


  .code-box { margin-top: 10px; }
  .code-area { margin-top: 8px; }
  .code-fn { margin: 10px 0; }
  .code-fn-head { font-size: var(--fs-label); color: var(--muted); margin-bottom: 4px; overflow-wrap: anywhere; }
  .code-fn-head b { color: var(--text); font-weight: 600; }
  .code-text {
    width: 100%; box-sizing: border-box; resize: vertical;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; tab-size: 4;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r-md); padding: 8px; white-space: pre; overflow: auto;
  }
  .code-fn-tools { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .code-msg { font-size: var(--fs-label); color: var(--muted); }
  .code-msg.ok { color: var(--ok); }
  .code-msg.err { color: var(--err); }

  .parts-wrap { flex: 1; min-width: 0; }
  .parts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .part > small { display: block; color: var(--muted); margin: 0 0 3px 2px; }
  .parts-count { display: block; color: var(--muted); margin: 4px 0 0 2px; }
  @media (max-width: 640px) { .parts { grid-template-columns: 1fr; } }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 6px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    min-height: 40px;
    cursor: text;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--surface-2);
    border-radius: var(--r-sm);
    padding: 3px 4px 3px 8px;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .chip button {
    border: 0;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0 4px;
  }
  .chip button:hover { color: var(--err); }
  @media (pointer: coarse) { .chip button, .zipa-chip button { min-width: 32px; min-height: 32px; } }

  .lang-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 6px; }
  .lang-row[hidden] { display: none !important; }
  .lang-row .chips { flex: 1; }
  .lang-row .lang-tag { padding-top: 26px; }
  .lang-tag {
    flex: none; width: 30px; padding-top: 10px;
    font-size: var(--fs-label); font-weight: 700; color: var(--muted);
  }
  .lang-row.other { opacity: .45; }
  .chips input {
    flex: 1;
    min-width: 120px;
    min-height: auto;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    padding: 3px;
  }

  select, input[type=number], input[type=text], input[type=password], input:not([type]), textarea {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    padding: 5px 8px;
    max-width: 100%;
  }
  select, input[type=number], input[type=text], input[type=password] { min-height: var(--hit); }
  input[type=number] { width: 90px; }
  select { max-width: min(320px, 100%); }
  .wide { width: 100%; margin-top: 6px; }
  input[type=range] { accent-color: var(--accent); min-height: var(--hit); }
  input[type=checkbox]:not(.g-switch) { accent-color: var(--accent); width: 18px; height: 18px; }
  .range { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .range input { width: 170px; min-width: 0; }
  .range output { width: 54px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
  .buttons select { flex: 1 1 140px; }

  details summary { cursor: pointer; font-weight: 600; }
  .advanced-settings > summary { gap: 12px; list-style: none; }
  .advanced-settings > summary::-webkit-details-marker { display: none; }
  .advanced-settings > summary::before { content: ""; width: 8px; height: 8px; flex: none; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
  .advanced-settings[open] > summary::before { transform: rotate(45deg); }

  .settings-page details:not(.g-section) > summary { display: flex; align-items: center; min-height: var(--hit); }
  .g-toast[data-kind="err"] { background: var(--err); color: var(--surface); }

  @media (max-width: 520px) {
    .range { flex: 1 1 100%; }
    .range input { flex: 1; }
  }


  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  header .inner {
    max-width: var(--w-header); margin: 0 auto; padding: var(--s3) var(--s4) var(--s1);
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--s1) var(--s3);
  }
  header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header h1 .logo { height: 32px; width: auto; display: block; }

  .layout { display: grid; grid-template-columns: 180px minmax(0, 1fr); max-width: var(--w-header); margin: 0 auto; }
  .layout > main { margin: 0; }
  .side { position: sticky; top: var(--voice-header-height, 53px); align-self: start; padding: var(--s5) 0 var(--s4) var(--s4); }
  #backupRexRow { scroll-margin-top: calc(var(--voice-header-height, 53px) + var(--s2)); }
  #tabs .g-tabs-list { flex-direction: column; overflow: visible; gap: 2px; }
  #tabs .g-tabs-list > [role="tab"] { min-height: 36px; text-align: left; padding: 0 var(--s3); border-bottom: 0;
    border-left: 2px solid transparent; border-radius: 0 var(--r-md) var(--r-md) 0; }
  #tabs .g-tabs-list > [role="tab"][aria-selected="true"] { font-weight: 400; border-left-color: transparent;
    background: color-mix(in srgb, var(--accent) 10%, transparent); }
  #tabs .g-tabs-more { display: none !important; }

  @media (max-width: 700px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; padding: var(--s2) var(--s4) 0; }
    #tabs .g-tabs-list { flex-direction: row; overflow-x: auto; }
    #tabs .g-tabs-list > [role="tab"] { border-left: 0; border-bottom: 2px solid transparent; border-radius: 0; }
    #tabs .g-tabs-list > [role="tab"][aria-selected="true"] { border-bottom-color: var(--accent); background: none; }
    #tabs[data-more~="start"] > .g-tabs-more[data-side="start"],
    #tabs[data-more~="end"] > .g-tabs-more[data-side="end"] { display: flex !important; }
  }


  .apps { flex: none; flex-wrap: wrap; max-width: 100%; margin-left: auto; }
  .apps[hidden] { display: none; }
  :is(.apps, .apps-ai) > button:not(.ui-id-copy) { font-size: var(--fs-label); font-weight: 600; padding: 0 var(--s2); }
  .apps-ai { padding: 0 0 0 var(--s1); border-left: 1px solid var(--line); border-radius: 0; background: none; }
  .page { display: none; }
  .page.on { display: block; }

    .orch-list { display: grid; gap: 6px; }
    .orch-row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 6px 8px;
      border: 1px solid var(--g-line, #333); border-radius: 8px; }
    .orch-row b { font-size: 1.05em; }
    .orch-row .muted { overflow-wrap: anywhere; }
    .orch-row .g-btn { margin-left: auto; }

    #orchSessions { gap: 10px; }
    .terminal-card { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 10px 14px;
      padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
      transition: border-color .2s, box-shadow .2s; }
    .terminal-card.is-focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .terminal-card [hidden] { display: none !important; }
    .terminal-num { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700;
      font-size: 1.05em; background: var(--surface-2); color: var(--muted); }
    .terminal-card.is-focus .terminal-num { background: var(--accent); color: #fff; }
    .terminal-name { position: relative; min-width: 0; display: block; }
    .terminal-name input { width: 100%; min-width: 0; box-sizing: border-box; font-weight: 600; font-size: 1.05em;
      border-color: transparent; background: transparent; padding-left: 6px; margin-left: -6px; }
    .terminal-name input:hover { border-color: var(--line); }
    .terminal-name input:focus { border-color: var(--accent); background: var(--surface); }
    .terminal-status { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .terminal-meta { grid-column: 2/-1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: -4px;
      color: var(--muted); font-size: .85em; min-width: 0; }
    .terminal-meta > span { padding: 2px 8px; border-radius: 6px; background: var(--surface-2); }
    .terminal-meta code { color: var(--text); font-size: 1em; }
    .terminal-meta .terminal-path { background: none; padding-left: 2px; overflow-wrap: anywhere; }
    .terminal-card .terminal-voice-controls { grid-column: 2/-1; display: grid !important;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto; align-items: end !important; gap: 10px !important;
      padding-top: 12px; border-top: 1px dashed var(--line); }
    .terminal-voice-field { position: relative; display: grid; gap: 4px; min-width: 0; }
    .terminal-voice-field small { color: var(--muted); font-size: .8em; }
    .terminal-voice-field select { width: 100%; min-width: 0; }
    .terminal-card .terminal-voice-controls > small { grid-column: 1/-1; color: var(--muted); font-size: .8em; line-height: 1.4; }
    .terminal-card .terminal-voice-controls > small:empty { display: none; }

    .terminal-name > .ui-id-copy, .terminal-voice-field > .ui-id-copy { position: absolute; right: 26px; bottom: 6px; margin: 0; }
    .terminal-name > .ui-id-copy { right: 4px; }
    .terminal-voice-controls > .ui-id-copy { display: none; }
    @media (max-width: 760px) {
      .terminal-card { grid-template-columns: auto minmax(0,1fr); }
      .terminal-status { grid-column: 2; }
      .terminal-meta, .terminal-card .terminal-voice-controls { grid-column: 1/-1; }
      .terminal-card .terminal-voice-controls { grid-template-columns: minmax(0,1fr); }
    }
    .orch-feed { max-height: 420px; overflow: auto; display: grid; gap: 4px; font-size: .92em; }
    .orch-msg { padding: 4px 8px; border-left: 3px solid var(--g-line, #444); white-space: pre-wrap; overflow-wrap: anywhere; }
    #orchThreads .orch-row {border-inline-start:4px solid #28854d;background:rgba(47,157,88,.12)}
    .orch-row[data-dialog] {cursor:pointer}
    .orch-msg[data-side="b"] {margin-inline-start:12%;border-color:#5593d8}
    .orch-msg[data-side="a"] {margin-inline-end:12%;border-color:#359360}
    #orchFinishedRows[hidden] {display:none}
    .orch-msg[data-kind="message"], .orch-msg[data-kind="reply"] { border-color: var(--g-accent, #6aa0ff); }
    .orch-msg[data-kind="error"] { border-color: #e05555; }
    .orch-msg small { opacity: .7; }


  .mic-missing { color: var(--err) !important; font-weight: 600; }
  input.chip-edit { font: inherit; padding: 2px 6px; border-radius: var(--r-sm); border: 1px solid var(--accent);
    background: var(--bg); color: inherit; min-width: 4ch; min-height: auto; }
  .held-list { margin: 8px 0 12px; padding-left: 20px; max-height: 220px; overflow: auto; }
  .held-list li { margin: 4px 0; }
  .held-list li.muted { list-style: none; margin-left: -20px; color: var(--muted); }

  #banners { display: grid; gap: var(--s2); margin-bottom: var(--s3); }
  #banners:empty { display: none; }
  #soundSummary.voice-paused small { color: var(--warn); font-weight: 600; }
  .hero { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--s2); }
  .hero .status-line { color: var(--muted); padding-left: 24px; }
  .home-tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s2); margin-top: var(--s3); }
  .facts { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  @media (max-width: 520px) {
    .facts { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .facts dt { font-size: var(--fs-label); margin-top: var(--s2); }
  }

  .meter { position: relative; height: 12px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line);
           border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .meter .zone-voice { position: absolute; top: 0; bottom: 0; right: 0; background: color-mix(in srgb, var(--ok) 22%, transparent); }
  .meter-bar { position: absolute; left: 0; top: 3px; height: 6px; width: 0; border-radius: 3px; background: var(--line-strong); transition: width .12s; }
  .meter-bar.voice { background: var(--ok); }
  .meter-mark { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text); }
  .meter-scale { position: relative; height: 16px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meter-scale span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .meter-scale span:first-child { transform: none; }
  .meter-scale span:last-child:not(:first-child) { transform: translateX(-100%); }
  .meter-legend { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: var(--fs-label); color: var(--muted); margin-top: 2px; }
  .meter-legend .quiet::before, .meter-legend .voice::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .meter-legend .voice::before { background: color-mix(in srgb, var(--ok) 55%, transparent); box-shadow: none; }
  .meter-now { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text); }

  .ear-state { margin-bottom: 4px; font-weight: 600; }
  .ear-state:empty { display: none; }
  .meter-devices { font-size: var(--fs-label); color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }

  .controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .controls .g-btn { flex-direction: column; align-items: flex-start; padding: 8px 12px; text-align: left; }
  .controls .g-btn small { display: block; color: var(--muted); font-size: var(--fs-label); }


  .guide h2 { margin-bottom: 8px; }
  .guide p, .guide li { margin: 0 0 6px; }
  .guide ul, .guide ol { margin: 0; padding-left: 20px; }
  .guide .kw {
    background: var(--accent-soft); color: var(--text);
    border-radius: var(--r-sm); padding: 1px 6px; font-weight: 600; white-space: nowrap;
  }
  .guide .g-pill { display: flex; margin-bottom: 6px; font-size: var(--fs-body); }



  header .inner { position: relative; }
  .header-tools { display:flex; align-items:center; gap:var(--s2) 24px; margin-left:auto; min-width:0; flex-wrap:wrap; justify-content:flex-end; }
  @media (max-width: 900px) { header .inner { flex-wrap:wrap; } .fold-icons { position:static; transform:none; } }
  .fold-icons { position: absolute; left: calc(180px + var(--s4)); top: 50%; transform: translateY(-50%); display: flex; gap: 6px; }
  @media (max-width: 700px) { .fold-icons { position: static; transform: none; } }
  .fold-icons[hidden] { display: none; }
  .fold-icon { width: var(--hit); height: var(--hit); display: grid; place-items: center; padding: 0; cursor: pointer;

(function () {
  const send = (kind, text) => {
    try {
      navigator.sendBeacon ? navigator.sendBeacon("/api/uilog",
        new Blob([JSON.stringify({ kind, text })], { type: "application/json" }))
        : fetch("/api/uilog", { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ kind, text }) });
    } catch (e) {}
  };
  window.__uilog = send;


  const nudge = () => {
    if (window.webkit?.messageHandlers || window.pywebview) {
      document.documentElement.classList.remove("wk-paint");
      void document.body?.offsetHeight;
    }
  };
  window.__nudge = nudge;
  window.addEventListener("resize", nudge);
  window.addEventListener("focus", nudge);
  window.addEventListener("pywebviewready", nudge);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) nudge(); });
  for (const ms of [300, 1200, 3000]) setTimeout(nudge, ms);
  window.addEventListener("error", (e) =>
    send("error", `${e.message} (${e.filename}:${e.lineno})`));
  window.addEventListener("unhandledrejection", (e) =>
    send("error", "promise: " + String(e.reason).slice(0, 200)));
  document.addEventListener("DOMContentLoaded", () => send("dom", document.title || ""));
  window.addEventListener("load", () => send("load", `${document.body.childElementCount} elements`));
})();
</script>
<script>
  const COMMANDS = ["space", "double", "enter", "enter2",
    "read_off", "read_on", "mic_mute", "mic_on",
    "switch", "previous", "project", "active", "tab1", "tab2", "tab3", "tab4", "tab5", "clear", "stop", "wake"];

  const COMMAND_GROUPS = [

    ["terminals", "Terminals", ["switch", "previous", "project", "active", "tab1", "tab2", "tab3", "tab4", "tab5"]],
    ["speech", "Speech and dictation", ["mic_mute", "mic_on", "read_off", "read_on", "stop", "wake"]],
    ["other", "Other", []]

  function commandGroups(root, where) {
    const targets = {};
    for (const [id, en, keys] of COMMAND_GROUPS) {
      const section = document.createElement("details");
      section.className = "g-section command-category";
      const storageKey = `voice-command-group-${where}-${id}`;
      try { section.open = localStorage.getItem(storageKey) === "open"; } catch (_) {}

    }

  }


  function expandParts(parts) {
    const clean = (col) => (col || []).map((w) => w.trim()).filter(Boolean);
    const first = clean(parts[0]), second = clean(parts[1]);
    const out = [];
    for (const a of first.length ? first : ["-"]) {
      for (const b of second.length ? second : [""]) {
        const pair = [a, b].filter((x) => x && x !== "-");

        for (const phrase of new Set([pair.join(" "), [...pair].reverse().join(" ")])) {
          if (phrase && !out.includes(phrase)) out.push(phrase);
        }
      }
    }
    return out;
  }
  const $ = (id) => document.getElementById(id);
  let cfg = null;
  const buttonEditor = GoblinControllersEditor($("buttonProfiles"), () => dirty(), key => T(key));
  let previewState = null, previewEpoch = 0, previewPending = 0, previewDirty = false;
  let previewEditVersion = 0, previewListening = false, previewQueue = Promise.resolve();

  function previewEngine(button) {
    if (button.dataset.previewEngine !== undefined) return button.dataset.previewEngine;
    return button.dataset.secondary ? ($("secondary_reading").value || previewState?.primary) : previewState?.primary;
  }
  function refreshPreviewButtons() {
    const blocked = previewState?.blocked;
    const reason = blocked === "paused" ? T("s.speak.preview_paused")
      : blocked === "output" ? T("s.speak.preview_output") : "";
    document.querySelectorAll(".test-voice, [data-preview-engine]").forEach(button => {
      const engine = previewEngine(button);
      const secondary = !!button.dataset.secondary;
      const terminal = button.dataset.previewEngine !== undefined;
      const roleMatches = terminal || (secondary ? previewState?.secondary === engine : previewState?.primary === engine);
      const ready = !reason && !previewPending && !previewDirty && !previewListening && roleMatches
        && !!previewState?.ready?.[engine] && (!secondary || $("read_scope").value === "all")
        && !button.closest('[data-dirty="true"]');
      const connecting = !ready && !reason;
      button.disabled = !ready;
      button.setAttribute("aria-busy", String(connecting));
      button.textContent = T(connecting ? "s.speak.connecting" : "s.speak.listen");
      button.title = reason || (terminal ? T(engine ? "s.speak.listen" : "agent.auto_hint") : "");
      if (reason) button.setAttribute("aria-description", reason);
      else button.removeAttribute("aria-description");
    });

  let ignoreEditor = null;
  const lang = "en";
  let lastMsg = ["", "", ""];


  const T = (key) => (TEXTS[key] ?? key);

  function qhint(full) {
    return `<i class="qhint" tabindex="0">?<span class="qtip">${full}</span></i>`;
  }
  function hintHTML(key) {

  function placeTip(q) {
    const tip = q.querySelector(".qtip"), r = q.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(r.left - 12, innerWidth - tip.offsetWidth - 8)) + "px";
    tip.style.top = (r.bottom + 6 + tip.offsetHeight > innerHeight ? Math.max(8, r.top - 6 - tip.offsetHeight) : r.bottom + 6) + "px";
  }


  document.addEventListener("click", (e) => {
    const q = e.target.closest && e.target.closest(".qhint");
    document.querySelectorAll(".qhint.open").forEach((o) => o !== q && o.classList.remove("open"));
    if (!q) return;
    e.preventDefault();
    if (e.target.closest(".qtip")) return;
    q.classList.toggle("open");
    if (q.classList.contains("open")) placeTip(q);
  }, true);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") document.querySelectorAll(".qhint.open").forEach((o) => o.classList.remove("open"));
    else if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("qhint")) {

  const APP_INFO = {
    remote: ["Remote", "~/Desktop/distributive/goblin-remote/Goblin Remote Adaptive.app"],
    lenta: ["dash.lenta", "~/Collector/Collector.app"],
  };
  const APP_WAIT = 30000;
  const appUp = { remote: false, lenta: false };
  let appWaitUntil = 0;
  const appTitle = (which) => (TEXTS[APP_INFO[which][0]] ? T(APP_INFO[which][0]) : APP_INFO[which][0]);
  function appPage(which) {
    $("page-dash").classList.toggle("g-launch-on", !!which);
    $("appPage").hidden = !which;

    if (!which) return;

    $("appPath").textContent = APP_INFO[which][1];
    $("appStart").disabled = false;
  }
  async function openApp(which) {
    if (appUp[which]) {
      const r = await post("/api/switch-app", { app: which });
      if (r && r.running) return appPage("");
    }
    appPage(which);
  }

  function appPageTick() {
    const which = $("appPage").hidden ? "" : $("appPage").dataset.app;
    if (!which) return;
    if (appUp[which]) return appPage("");
    if (appWaitUntil && Date.now() > appWaitUntil) {
      appWaitUntil = 0;
      $("appPage").dataset.state = "error";
      $("appState").textContent = T("app.failed");
      $("appStart").disabled = false;
    }
  }
  $("appClose").addEventListener("click", () => appPage(""));
  $("appStart").addEventListener("click", async () => {
    const which = $("appPage").dataset.app;
    $("appStart").disabled = true;
    $("appPage").dataset.state = "busy";
    $("appState").textContent = T("app.starting");
    let r = null;
    try { r = await post("/api/launch", { app: which }); } catch (e) {}
    if (r && r.ok) {
      appWaitUntil = Date.now() + APP_WAIT;
      return;
    }
    $("appPage").dataset.state = "error";
    $("appState").textContent = r && r.error === "missing"
      ? T("app.missing").replace("{path}", r.path || APP_INFO[which][1]) : T("app.failed");

  document.querySelector('#apps [data-app="lenta"]').addEventListener("click", () => openApp("lenta"));
  document.querySelectorAll("#apps [data-app-launch]").forEach((button) => {
    button.addEventListener("click", async () => {
      button.disabled = true;
      let result;
      try {
        result = await post("/api/launch", {app: button.dataset.appLaunch});
      } catch (_) {
        result = null;
      } finally {
        button.disabled = false;
      }
      if (!result?.ok) {
        const path = result?.error === "missing" && result.path;
        msg("app.open_failed", "err", ` ${T(button.dataset.i18n)}${path ? ` (${path})` : ""}`);

  const getPath = (obj, path) => path.split(".").reduce((o, k) => o?.[k], obj);
  const setPath = (obj, path, val) => {
    const keys = path.split(".");
    const last = keys.pop();
    keys.reduce((o, k) => (o[k] ??= {}), obj)[last] = val;
  };


  const firstWord = (data) => ((data || {})["words_" + lang] || [])[0] || "—";


  function markChips() {
    document.querySelectorAll("#commands .lang-row:not(.zipa-row)").forEach((row) => {
      const other = row.dataset.lang !== lang;
      row.hidden = other;
    });
  }


  function editInPlace(el, value, done) {
    const input = document.createElement("input");
    input.className = "chip-edit";
    input.value = value;
    input.size = Math.max(4, value.length + 1);
    let finished = false;
    const finish = (save) => {
      if (finished) return;
      finished = true;
      const v = input.value.trim();
      input.replaceWith(el);
      if (save && v && v !== value) done(v);
    };
    input.addEventListener("keydown", (e) => {
      e.stopPropagation();
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); finish(false); }
    });
    input.addEventListener("input", (e) => { e.stopPropagation(); input.size = Math.max(4, input.value.length + 1); });
    input.addEventListener("blur", () => finish(true));
    el.replaceWith(input);
    input.focus();
    input.select();
  }


  function chipEditor(words) {
    const box = document.createElement("div");
    box.className = "chips";
    const input = document.createElement("input");
    input.dataset.i18nPh = "chips.add";
    input.placeholder = T("chips.add");

    const add = (w) => {
      w = w.trim();
      if (!w || [...box.querySelectorAll(".chip span")].some((s) => s.textContent === w)) return;
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.innerHTML = "<span></span><button data-i18n-title='chips.remove'>×</button>";
      chip.firstChild.textContent = w;
      chip.lastChild.title = T("chips.remove");
      chip.lastChild.onclick = () => { chip.remove(); dirty(); };

      chip.firstChild.addEventListener("dblclick", (e) => {
        e.stopPropagation();
        chip.draggable = false;
        editInPlace(chip.firstChild, chip.firstChild.textContent, (v) => {
          const same = [...box.querySelectorAll(".chip span")].some((s) => s !== chip.firstChild && s.textContent === v);
          if (same) return;
          chip.firstChild.textContent = v;
          dirty();
          box.dispatchEvent(new Event("input", { bubbles: true }));
        });
        setTimeout(() => (chip.draggable = true), 0);
      });

      chip.draggable = true;
      chip.addEventListener("dragstart", (e) => {
        dragged = chip;
        chip.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", w);
      });
      chip.addEventListener("dragend", () => {
        chip.classList.remove("dragging");
        if (dragged) {
          dragged = null;
          dirty();
          box.dispatchEvent(new Event("input", { bubbles: true }));
        }
      });
      box.insertBefore(chip, input);
    };
    let dragged = null;
    box.addEventListener("dragover", (e) => {
      if (!dragged || dragged.parentNode !== box) return;
      e.preventDefault();
      const over = e.target.closest(".chip");
      if (!over || over === dragged) return;
      const r = over.getBoundingClientRect();
      const after = e.clientX > r.left + r.width / 2;
      box.insertBefore(dragged, after ? over.nextSibling : over);
    });
    box.addEventListener("drop", (e) => e.preventDefault());

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === ",") {
        e.preventDefault();
        input.value.split(",").forEach(add);
        input.value = "";
        dirty();
      } else if (e.key === "Backspace" && !input.value) {
        box.querySelectorAll(".chip").length && box.querySelector(".chip:last-of-type")?.remove();
        dirty();
      }
    });
    input.addEventListener("blur", () => {
      if (input.value.trim()) { input.value.split(",").forEach(add); input.value = ""; dirty(); }
    });
    box.onclick = (e) => { if (e.target === box) input.focus(); };

    box.appendChild(input);
    words.forEach(add);
    box.words = () => [...box.querySelectorAll(".chip span")].map((s) => s.textContent);
    return box;
  }

  function renderCommands() {
    const root = $("commands");
    root.innerHTML = "";
    const groups = commandGroups(root, "settings");
    for (const key of COMMANDS) {
      const data = cfg.commands[key] || { enabled: true, words_ru: [], words_en: [] };

      const wrap = cmdDetails(key, "settings");
      wrap.classList.add("cmd");

      wrap.innerHTML = `

          <p data-cmd-text="${key}.more"></p>

      const editors = {};

          col.append(head, ed);
          cols.appendChild(col);

        const hint = document.createElement("small");
        hint.className = "parts-hint";
        const recount = () => {
          const words = expandParts(editors[L].map((ed) => ed.words()));
          count.textContent = T("parts.count").replace("{n}", words.length);
          hint.textContent = T("parts.hint") + " " + (words.slice(0, 3).join(", ") || "—");
        };
        cols.addEventListener("input", recount);
        cols.addEventListener("click", () => setTimeout(recount));
        cols.addEventListener("keyup", recount);
        cols.addEventListener("focusout", () => setTimeout(recount));
        recount();
        const right = document.createElement("div");
        right.className = "parts-wrap";
        right.append(cols, count, hint);
        row.append(tag, right);
        body.appendChild(row);
      }

      const zrow = document.createElement("div");
      zrow.className = "lang-row zipa-row";
      const ztag = document.createElement("span");
      ztag.className = "lang-tag";
      ztag.textContent = "ZIPA";
      const zbox = document.createElement("div");
      zbox.className = "zipa-box";
      const samples = document.createElement("div");
      samples.className = "zipa-samples";
      zbox.appendChild(samples);
      ((cfg.zipa_templates || {})[key] || []).forEach((s, i) => {
        const chip = document.createElement("span");
        chip.className = "zipa-chip";
        const text = document.createElement("span");
        text.textContent = s;
        text.title = ("Double-click to edit");

        text.addEventListener("dblclick", () => editInPlace(text, s, (v) =>
          post("/api/action", { name: `zipa_edit.${key}.${i}`, value: v }).then(load)));
        chip.append(text, " ");
        const x = document.createElement("button");
        x.type = "button";
        x.textContent = "✕";
        x.title = ("Delete sample");
        x.onclick = () => post("/api/action", { name: `zipa_forget.${key}.${i}` });
        chip.appendChild(x);
        samples.appendChild(chip);
      });
      const rec = document.createElement("button");
      rec.type = "button";
      rec.className = "g-btn zipa-rec";
      rec.dataset.zipaRec = key;
      rec.textContent = ("🎙 Record sample");
      rec.onclick = () => post("/api/action", { name: `zipa_record.${key}` });
      zbox.appendChild(rec);
      const manual = document.createElement("input");
      manual.type = "text";
      manual.placeholder = ("IPA sample: r ɛ k s");
      manual.setAttribute("aria-label", ("IPA sample text"));
      manual.title = ("Spaces between IPA sounds are optional; initial comma ≈220 ms, period ≈450 ms");
      manual.addEventListener("input", e => e.stopPropagation());
      const add = document.createElement("button");
      add.type = "button"; add.className = "g-btn";
      add.textContent = ("Add text");
      const saveSample = async () => {
        if (!manual.value.trim()) { manual.focus(); return; }
        add.disabled = true;
        try { await post("/api/action", { name: `zipa_add.${key}`, value: manual.value }); await load(); }
        finally { add.disabled = false; }
      };
      add.onclick = saveSample;
      manual.addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") { e.preventDefault(); saveSample(); } });
      const manualRow = document.createElement("div");
      manualRow.className = "zipa-manual";
      manualRow.append(manual, add);
      zbox.appendChild(manualRow);

      const zstate = document.createElement("span");
      zstate.className = "zipa-state";
      zbox.appendChild(zstate);
      zrow.append(ztag, zbox);
      body.appendChild(zrow);
      body.appendChild(codeBlock(key));
      wrap.collect = () => {
        const out = { enabled: toggle.checked };
        for (const L of ["en"]) {
          out["parts_" + L] = editors[L].map((ed) => ed.words());
          out["words_" + L] = expandParts(out["parts_" + L]);

        return out;
      };
      wrap.dataset.key = key;
      (groups[key] || root).appendChild(wrap);
    }
    markChips();
  }


  function fill(data) {

  function mergeLog(lines) {
    const out = [];
    for (let i = 0; i < lines.length; i++) {
      const typed = lines[i].match(/^(\S+ \S+ \w+ )(typed) (.*)$/);
      const heard = typed && (lines[i + 1] || "").match(/^\S+ \S+ \w+ (?:heard \(typing\)|OpenAI \(typing\)): (.*)$/);
      if (heard && (typed[3] === heard[1] || typed[3].startsWith(heard[1] + " → "))) {

  function logRow(line) {
    const m = line.match(/^\d{4}-\d\d-\d\d (\d\d:\d\d:\d\d)(?:,\d+)? (\w+) ([\s\S]*)$/);
    if (!m) return `<div class="log-row"><span></span><span class="log-kind"></span><span class="log-msg">${escHtml(line)}</span></div>`;
    let [, time, level, msg] = m;
    let kind = "", label = "";
    for (const [re, k] of LOG_KINDS) {
      const hit = msg.match(re);
      if (hit) { kind = k; label = hit[1]; msg = msg.slice(hit[0].length); break; }
    }
    const lvl = level === "ERROR" || level === "CRITICAL" ? "err" : level === "WARNING" ? "warn" : "";
    if (lvl && !label) { kind = lvl; label = lvl === "err" ? T("log.err") : T("log.warn"); }

    let body = escHtml(msg).replace(/(&quot;[^]*?&quot;|'[^']*'|«[^»]*»)/g, '<span class="log-q">$1</span>');

    const cut = kind === "voice" ? msg.indexOf(" ¶ ") : -1;
    if (cut >= 0) {
      let full = msg.slice(cut + 3);
      try { full = JSON.parse(full); } catch (e) {}
      const key = escHtml(line.slice(0, 23));
      body = `<details class="log-more" data-key="${key}"${logAllOpen || logOpen.has(line.slice(0, 23)) ? " open" : ""}>`
        + `<summary>${escHtml(msg.slice(0, cut))}</summary><div class="log-full">${escHtml(full)}</div></details>`;
    }
    if (kind === "typed" || kind === "both") body = body.replace(/ → ([^→]*)$/, ' <span class="log-to">→ $1</span>');
    return `<div class="log-row ${lvl}"><span class="log-time">${time}</span>`
      + `<span class="log-kind${kind ? " k-" + kind : ""}">${escHtml(label)}</span><span class="log-msg">${body}</span></div>`;
  }

  async function showCode(key, area) {

      try {
        const r = await (await fetch("/api/code?cmd=" + encodeURIComponent(key))).json();
        if (!r.ok) throw new Error(r.error);

    const hint = document.createElement("p");

  function codeFn(key, fn) {
    const wrap = document.createElement("div");
    wrap.className = "code-fn";
    const head = document.createElement("div");
    head.className = "code-fn-head";
    head.innerHTML = `<b></b> · <span class="fn-name"></span> · <span data-i18n="code.line"></span> <span class="fn-line"></span>`;
    head.querySelector("b").textContent = fn.file;
    head.querySelector(".fn-name").textContent = fn.name;
    head.querySelector("[data-i18n]").innerHTML = T("code.line");
    const num = head.querySelector(".fn-line");
    num.textContent = fn.line;

    const text = document.createElement("textarea");
    text.className = "code-text";
    text.spellcheck = false;
    text.value = fn.draft ?? fn.code;
    text.rows = Math.min(28, text.value.split("\n").length + 1);
    text.oninput = () => { fn.draft = text.value; };
    text.onkeydown = (e) => {
      if (e.key !== "Tab") return;
      e.preventDefault();
      text.setRangeText("    ", text.selectionStart, text.selectionEnd, "end");
      fn.draft = text.value;
    };

    const tools = document.createElement("div");
    tools.className = "code-fn-tools";
    tools.innerHTML = `<button class="g-btn" type="button" data-i18n="code.save"></button>
      <button class="g-btn" type="button" data-i18n="code.reset"></button><span class="code-msg"></span>`;

    const [saveBtn, resetBtn] = tools.querySelectorAll("button");
    const note = tools.querySelector(".code-msg");
    const say = (msgText, kind = "") => { note.textContent = msgText; note.className = "code-msg " + kind; };

    saveBtn.onclick = async () => {
      say(T("code.saving"));
      let r;
      try {
        r = await (await fetch("/api/code", {
          method: "POST",
          headers: { "X-Voice-Code": "1" },
          body: JSON.stringify({ file: fn.file, name: fn.name, code: text.value, hash: fn.hash }),
        })).json();
      } catch (e) {
        r = { ok: false, error: e.message };
      }
      if (!r.ok) { say(T("code.error") + " " + r.error, "err"); return; }

      for (const other of Object.keys(codeData)) {
        if (other !== key && codeData[other].some((f) => f.file === fn.file && f.name === fn.name && f.draft === undefined)) delete codeData[other];
      }
      Object.assign(fn, { code: r.code, hash: r.hash, line: r.line, draft: undefined });
      text.value = r.code;
      num.textContent = r.line;
      say(T("code.saved").replace("{b}", r.backup), "ok");
    };
    resetBtn.onclick = () => { text.value = fn.code; fn.draft = undefined; say(""); };

    wrap.append(head, text, tools);
    return wrap;
  }

  function showSound(st) {

    const V = (v, role = "input") => v === "phone" ? remoteDeviceLabel(st, role) || T("snd.v.phone") : T("snd.v." + v);
    const kind = (k) => {
      const device=(snd.channels?.devices||[]).find(d=>d.id===snd.channels?.output);
      return k==='headphones'&&now.speech==='phone'&&device?.audio_devices?.output_headset
        ? device.audio_devices.output_headset : T(k === "headphones" ? "snd.headphones" : "snd.speakers");
    };

    let micNow = now.mic === "off" ? (snd.mic === "phone" ? "away" : "off") : now.mic;
    if (snd.mic === "phone" && now.mic === "mac") micNow = "lost";
    let speechNow = now.speech === "off" ? (snd.speech === "phone" ? "away" : "off") : now.speech;

      const detail = String(e) + "\n" + (e.stack || "");
      if (poll.lastError !== detail) {
        poll.lastError = detail;
        window.__uilog?.("error", (stateReceived ? "state render: " : "state fetch: ") + detail);
      }
      if (stateReceived) {
        $("statusLine").textContent = T("mode.ui_error");
        return;
      }
      $("mode").textContent = T("mode.offline");
      $("heroPill").dataset.state = "err";
      previewState = null; refreshPreviewButtons();
      showBanners(null);
    }
  }



  const MODE_STATE = { listening: "ok", live: "live", speaking: "busy", paused: "off", muted: "wait",
                       error: "err", starting: "wait", offline: "err", voice_paused: "wait" };
  const EAR_STATE = { listening: "ok", openai: "live", phone: "ok", speech: "busy", busy: "busy",
                      wait_signal: "wait", deaf_play: "wait", deaf_voice: "wait", no_mic: "err", off: "off", paused: "wait" };


  function showBanners(st, noAccess = false, missingLabel = "") {
    const list = [];
    if (!st) list.push({ kind: "err", text: T("mode.offline") });
    else {

      const p = st.sound && st.sound.paused;
      if (p) list.push({ kind: "", text: T("pause.banner") + (st.sound.paused_at ? " · " + T("pause.since")
        .replace("{t}", String(st.sound.paused_at).slice(11, 16)) : ""), act: "voice.resume", btn: T("pause.resume") });
      if (noAccess) list.push({ kind: "err", text: T("banner.no_access"), act: "grant", btn: T("banner.grant") });
      if (st.mic_missing && !st.phone_listen) list.push({ kind: st.mic_fallback ? "" : "err", text: missingLabel,
                                                         go: "settings", fold: "s.sound.mic", btn: T("snd.mic.title") });
    }
    const sig = JSON.stringify(list);
    const box = $("banners");
    if (box.dataset.sig === sig) return;
    box.dataset.sig = sig;
    box.replaceChildren(...list.map((b) => {
      const el = document.createElement("div");
      el.className = "g-banner";
      if (b.kind) el.dataset.kind = b.kind;
      el.setAttribute("role", b.kind === "err" ? "alert" : "status");
      const text = document.createElement("span");
      text.className = "g-banner-text";
      text.textContent = b.text;
      el.append(text);
      if (b.btn) {
        const btn = document.createElement("button");
        btn.className = "g-btn";
        btn.dataset.kind = "primary";
        btn.textContent = b.btn;
        if (b.act) btn.dataset.act = b.act;
        if (b.go) { btn.dataset.goto = b.go; btn.dataset.foldOpen = b.fold; }
        el.append(btn);
      }
      return el;
    }));
  }


  $("mode").textContent = T("mode.starting");
  applyLang();
  initFolds({});
  showTab(location.hash.slice(1) || "dash");

  (function loadSettings(tryNo) {
    let done = false;
    const slow = setTimeout(() => {
      if (!done) window.__uilog && window.__uilog("slow", `settings did not arrive in 3 s (attempt ${tryNo})`);
    }, 3000);
    load()
      .then(() => {
        done = true; clearTimeout(slow);
        initFolds(cfg.ui_folds); renderLegend();
        window.__uilog && window.__uilog("ready", `settings received (attempt ${tryNo})`);
      })
      .catch((e) => {
        done = true; clearTimeout(slow);
        window.__uilog && window.__uilog("error", `settings request failed (attempt ${tryNo}): ${e}`);
        if (tryNo >= 5) { msg("msg.load_failed", "err", String(e)); return; }
        setTimeout(() => loadSettings(tryNo + 1), 1500);
      });
  })(1);
  setInterval(poll, 700);
  poll();
</script>
<script src="/ui_ids.js"></script>
</body>
</html>
